version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: trustguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trustguard}
      # `:?` not `:-`: compose refuses to start rather than silently booting
      # every deployment on the same committed password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${DB_NAME:-trustguard}
      # Optional. init.sql seeds the default admin from this; unset seeds none.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trustguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustguard-network

  # Backend API (to be created)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: trustguard-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-trustguard}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-trustguard}
      # Required too: a committed default here means anyone can mint valid tokens
      # for any deployment that did not override it.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trustguard-network

  # Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Empty on purpose: the bundle calls the page's own origin and nginx
        # proxies /api/ to the api container. This used to default to
        # http://api:3000, a docker-internal hostname the *browser* cannot
        # resolve, so every API call from the compose frontend failed.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: trustguard-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trustguard-network

volumes:
  postgres_data:
    driver: local

networks:
  trustguard-network:
    driver: bridge
