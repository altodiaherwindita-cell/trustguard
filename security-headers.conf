# Shared security headers.
#
# This is an `include` rather than a plain server-level block because nginx's
# add_header does not merge across levels: any location that calls add_header
# discards every header inherited from the server block. The asset and
# index.html locations both set Cache-Control, so without re-including this file
# they would silently ship without CSP or X-Frame-Options.

# Everything is same-origin: src/lib/api.ts uses relative URLs and nginx proxies
# /api/ to the api container, so connect-src needs no extra origin.
# style-src needs 'unsafe-inline' for Tailwind's inline style attributes and
# chart.tsx's <style> element. No 'unsafe-inline' on script-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Strict-Transport-Security is deliberately NOT set here. This server listens on
# plain HTTP :80 only; sending HSTS from it would tell browsers to force HTTPS
# on a port that cannot serve it and lock users out of the deployment. Add it to
# whichever layer terminates TLS, once one exists:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
